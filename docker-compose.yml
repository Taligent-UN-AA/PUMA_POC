services:
  app:
    build: .
    container_name: puma_poc
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: >
      uvicorn app:app --host 0.0.0.0 --port 8000
      --reload
      --reload-exclude .venv
      --reload-exclude "minimal bu"
      --reload-exclude minimal_bu_2
    restart: unless-stopped
